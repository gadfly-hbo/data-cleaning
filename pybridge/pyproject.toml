[project]
name = "pybridge"
version = "0.1.0"
description = "数据清洗平台 Python 子进程桥：pandera 规则执行 + Polars 画像计算"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.24",
    "fastexcel>=0.21.0",
    "greenlet>=3.5.6",
    "pandera>=0.20",
    "polars>=1.0",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
pybridge = "pybridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pybridge"]
